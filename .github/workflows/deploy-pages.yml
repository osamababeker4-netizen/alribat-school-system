name: Verify Alribat School System
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: alribat-dist
          path: dist

  live-smoke:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Render deployment is current and reachable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://alribat-school-system.onrender.com/"
          EXPECTED='<meta name="app-version" content="1.3.2" />'
          ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --location --silent --show-error --max-time 45 "$URL" -o /tmp/alribat-live.html; then
              if grep -Fq "$EXPECTED" /tmp/alribat-live.html && grep -Fq "مدرسة الرباط" /tmp/alribat-live.html; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1
