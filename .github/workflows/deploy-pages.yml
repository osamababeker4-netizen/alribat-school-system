name: Verify Alribat School System
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies deterministically
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Commit generated package lock once
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add deterministic dependency lockfile"
            git push origin HEAD:main
          fi
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: alribat-dist
          path: dist

  live-smoke:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Render deployment is current and reachable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://alribat-school-system.onrender.com/"
          EXPECTED='<meta name="app-version" content="1.3.2" />'
          ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --location --silent --show-error --max-time 45 "$URL" -o /tmp/alribat-live.html; then
              if grep -Fq "$EXPECTED" /tmp/alribat-live.html && grep -Fq "مدرسة الرباط" /tmp/alribat-live.html; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1
