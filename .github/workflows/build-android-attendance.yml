name: Build Al-Ribat Android Attendance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-attendance/**"
      - ".github/workflows/build-android-attendance.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-attendance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: alribat-attendance-debug-apk
          path: android-attendance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
