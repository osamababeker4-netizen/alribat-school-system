# Render Blueprint — Alribat School System
# Canonical deployment configuration for the production static site.

services:
  - type: web
    runtime: static
    name: alribat-school-system
    repo: https://github.com/osamababeker4-netizen/alribat-school-system
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_OCR_SERVICE_URL
        value: https://alribat-arabic-htr.onrender.com
    previews:
      generation: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN


  - type: web
    runtime: python
    name: alribat-arabic-htr
    repo: https://github.com/osamababeker4-netizen/alribat-school-system
    branch: main
    buildCommand: pip install -r ocr_service/requirements.txt
    startCommand: uvicorn ocr_service.app:app --host 0.0.0.0 --port $PORT --workers 1
    autoDeployTrigger: commit
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://nibmcganjnnzmfmnuhzl.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_odOiALgfgin8mv5yGWzD9w_Fnb_RDH9
