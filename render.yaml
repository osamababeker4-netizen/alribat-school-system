# Render Blueprint — Alribat School System
# Canonical deployment configuration for the production static site.

services:
  - type: web
    runtime: static
    name: alribat-school-system
    repo: https://github.com/osamababeker4-netizen/alribat-school-system
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    previews:
      generation: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
